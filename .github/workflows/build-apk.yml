      - name: Check signing configuration
        shell: bash
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in APK_KEYSTORE_BASE64 APK_KEYSTORE_PASSWORD APK_KEY_ALIAS APK_KEY_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Set GitHub Actions secret $var before publishing."
              exit 1
            fi
          done
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daepil-signing.jks"
          test -s "$RUNNER_TEMP/daepil-signing.jks"
      - name: Verify photo chooser implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MediaStore.ACTION_PICK_IMAGES' android-project/app/src/main/java/com/daepil/editor/MainActivity.java
          grep -q 'Intent.ACTION_PICK' android-project/app/src/main/java/com/daepil/editor/MainActivity.java
          grep -q 'EXTRA_ALLOW_MULTIPLE' android-project/app/src/main/java/com/daepil/editor/MainActivity.java
          grep -q 'getClipData' android-project/app/src/main/java/com/daepil/editor/MainActivity.java
          if grep -q 'ACTION_OPEN_DOCUMENT' android-project/app/src/main/java/com/daepil/editor/MainActivity.java; then
            echo '::error::Document picker must not be the default photo picker.'; exit 1
          fi
          echo 'Photo Picker + Gallery chooser integration present.'
      - name: Build release APK
        working-directory: android-project
        env:
          DAEPIL_UPDATE_REPOSITORY: ${{ github.repository }}
          DAEPIL_VERSION_CODE: ${{ format('{0}', github.run_number) }}
          DAEPIL_VERSION_NAME: ${{ format('{0}', github.run_number) }}
        shell: bash
        run: |
          set -euo pipefail
          export DAEPIL_VERSION_CODE="$((10000 + DAEPIL_VERSION_CODE))"
          export DAEPIL_VERSION_NAME="1.0.${DAEPIL_VERSION_NAME}"
          gradle --no-daemon --console=plain :app:assembleRelease
      - name: Sign, verify, and publish package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SRC="android-project/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$SRC" || { echo "::error::Unsigned APK not found"; exit 1; }
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SIGN="$SDK/build-tools/35.0.0/apksigner"
          test -x "$SIGN"
          export KS_PASS="$APK_KEYSTORE_PASSWORD" KEY_PASS="$APK_KEY_PASSWORD"
          "$SIGN" sign --ks "$RUNNER_TEMP/daepil-signing.jks" --ks-key-alias "$APK_KEY_ALIAS" \
             --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
             --out "$RUNNER_TEMP/daepil-editor.apk" "$SRC"
          "$SIGN" verify --verbose "$RUNNER_TEMP/daepil-editor.apk"
          mkdir -p out
          cp "$RUNNER_TEMP/daepil-editor.apk" out/daepil-editor.apk
          (cd out && sha256sum daepil-editor.apk > daepil-editor.apk.sha256)
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" out/daepil-editor.apk out/daepil-editor.apk.sha256 \
             --title "대필 편집기 ${TAG}" \
             --notes "삼성 앱 업데이트용 공식 서명 APK입니다. 앱에서 [업데이트]를 눌러 설치할 수 있습니다." \
             --latest
      - name: Save APK as workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: Daepil-Samsung-Update-APK
          path: out/daepil-editor.apk
          retention-days: 30
